<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollegeCorps Timesheet Optimizer</title>

    <!--Favicon-->
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
    <link rel="manifest" href="images/favicon/site.webmanifest">

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>

</head>
<body>
    <header>
        <h1>CollegeCorps Timesheet Optimizer</h1>
    </header>

    <main class ="dashboard-container">
        
        <section class ="card input-section">

            <p>Log your hours</p>
            <form id ="timesheet-form">
                <label for="date-input">Date:</label>
                <input type="date" id = "date-input" required>

                <label for="hours-input">Hours Worked:</label>
                <input type="number" id="hours-input" min="0" max="24" step=".25" required>

                <label for="category-select">Service Type:</label>
                <select id="category-select" required>
                    <option value ="" disabled selected>-- Choose a Category --</option>
                    <option value ="training">Training Hours</option>
                    <option value="service">Service Hours</option>
                </select>

                <button type="submit" id="log-hours">Log Hours</button>
            </form>
        </section>

        <!--Righthand column for stats and data tracking!-->

        <section class = "card stats-section">
            <p>Important Statistics</p>
                <div class ="progress-track">
                    <div class="progress-fill" id="hours-progress-bar"></div>
                </div>

                <div class="stats-display">
                    <p>Total Hours Logged: <strong id="total-hours-text">0</strong>/450 hrs</p>
                    <p>Remaining Hours Needed: <strong id="remaining-hours-text">450</strong> hrs</p>
                </div>

                <div class = "history-container">

        <!--Table showing previous shifts history-->

                    <h3>Logged Shifts History</h3>

                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Hours</th>
                                <th>Category</th>
                            </tr>
                        </thead>

                        <tbody id="history-log-table">

                        </tbody>

                        
                    </table>
                </div>
        </section>

    </main>

</body>

</html>
